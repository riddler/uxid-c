# The tools the build and the gate use. The C compiler is the platform's own
# (the gate prints its version first); mise pins every tool around it.
[tools]
"aqua:Kitware/CMake" = "4.4.4"
# clang-format and clang-tidy are LLVM's PyPI releases, installed through uv
# into a virtualenv on this pinned Python.
python = "3.14.8"
"aqua:astral-sh/uv" = "0.13.4"
"pipx:clang-format" = "23.1.3"
"pipx:clang-tidy" = "23.1.3"

[settings]
pipx.uvx = true

[tasks."gate:loop"]
description = "Inner loop: configure, build and run the CTest tests (never the advancement gate)"
run = """
#!/usr/bin/env bash
set -euo pipefail
cmake --preset default
cmake --build --preset default
ctest --preset default
"""

[tasks.gate]
description = "The full gate"
run = """
#!/usr/bin/env bash
set -euo pipefail
step() { printf '\\n==> %s\\n' "$1"; }

step "compiler (${CC:-cc})"
"${CC:-cc}" --version

step "configure, build and CTest (default preset)"
cmake --preset default
cmake --build --preset default
ctest --preset default

step "AddressSanitizer and UndefinedBehaviorSanitizer build and CTest (asan-ubsan preset)"
cmake --preset asan-ubsan
cmake --build --preset asan-ubsan
ctest --preset asan-ubsan

step "ThreadSanitizer build and CTest (tsan preset)"
cmake --preset tsan
cmake --build --preset tsan
ctest --preset tsan

step "format check (clang-format)"
clang-format --version
# tests/vendor holds vendored code, kept byte for byte as released.
find include src tests -path tests/vendor -prune -o -type f \\( -name '*.c' -o -name '*.h' \\) -print0 | xargs -0 clang-format --dry-run --Werror

step "clang-tidy (the default preset's compile database)"
clang-tidy --version
sysroot=()
if command -v xcrun >/dev/null 2>&1; then
  sysroot=(--extra-arg="-isysroot$(xcrun --show-sdk-path)")
fi
clang-tidy -p build/default --quiet "${sysroot[@]}" src/*.c tests/*.c

step "line coverage of src/, 90 percent minimum (coverage preset)"
rm -rf build/coverage/profiles
cmake --preset coverage
cmake --build --preset coverage
ctest --preset coverage
cmake -DUXID_BUILD_DIR=build/coverage -DUXID_SOURCE_DIR=. -DUXID_MIN_LINES=90 -P scripts/coverage.cmake

step "conformance corpus check (conformance/ against its manifest and SOURCE.json)"
cmake -DUXID_CORPUS_DIR=conformance -P scripts/check_corpus.cmake

printf '\\ngate: green\\n'
"""
