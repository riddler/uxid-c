name: Release

# Creates this package's GitHub release when a version tag is pushed, and
# only when these hold at the tagged commit: it is on the default branch, the
# tag is `v` followed by UXID_VERSION_STRING in include/uxid.h there (which
# is also the CMake project version: CMakeLists.txt reads the version from
# that header, and configuring stops when the header's macros disagree),
# the repository has no published release on the tag, the full gate is
# green there, and CHANGELOG.md has a section for the version. Nothing else
# triggers it - no branch push, no pull request, no manual dispatch. There
# is no package registry: the GitHub release is the published version.
#
# Two jobs, each on the tagged commit (github.sha):
#
# - `verify` (contents: read, and no other permission; it reads no secret)
#   checks the branch and the version before anything is installed, then
#   asks the GitHub API whether a published release exists on the tag. If
#   one does, the job reports it and every later step of the run is
#   skipped: the run is green and creates nothing. Otherwise it runs the
#   full gate, checks the CMake project version the gate's configure wrote
#   (build/default/CMakeCache.txt) against the tag, makes
#   uxid-VERSION.tar.gz from the tag with `git archive`, writes its SHA-256
#   to uxid-VERSION.tar.gz.sha256 in `sha256sum` format, takes the
#   version's CHANGELOG.md section as the release notes (stopping when
#   there is none), uploads the three files as one workflow artifact, and
#   records the SHA-256 of the tarball and of the notes as this job's
#   outputs.
# - `publish` (contents: write, the only job that holds it, for
#   `gh release create`; no other permission) starts only when `verify`
#   succeeded and found no published release. It checks out nothing and
#   installs no toolchain: it uses the runner's own `sha256sum` and `gh`.
#   It downloads the artifact and stops unless `sha256sum --check` passes on
#   the .sha256 file and the tarball and the notes have the SHA-256 values
#   `verify` recorded. It asks the API again whether a published release
#   exists on the tag and then lists the repository's draft releases, which
#   this job's token can see and `verify`'s cannot: a published release is
#   reported and the job passes without creating one; a draft on the tag
#   stops the job. Otherwise `gh release create --verify-tag`
#   creates the release on the existing tag with the two files and the
#   notes, and the job prints the release's URL.
#
# Every action this workflow uses, in both jobs, is pinned to a full commit
# SHA, with its version in a trailing comment: in `publish` the steps share
# a runner with a token that can write to the repository, and in `verify`
# the actions check out the source the tarball is made from, install the
# tools the gate runs and store the files `publish` attaches, so a moved
# tag in either job could change what is released.
#
# What a failure leaves behind. A failure in `verify`, or in `publish`
# before `gh release create`, creates no release. `gh release create` makes
# the release as a draft, uploads the two files to it and then publishes
# it; when an upload or the publish fails, it deletes the draft it made. A
# draft can still be left behind: when that deletion fails too, when the
# job is stopped or cut off part way (its timeout, a cancellation, a lost
# runner) after the draft exists, or when the create call succeeds but its
# answer is lost before gh can clean up. The release URL
# step runs after the release exists, so a failure there leaves the release
# in place and the run red. No failure moves or deletes the tag.
#
# Re-running. The manual act this workflow needs is a re-run from the run's
# page in the Actions tab, for a run that failed for a reason outside the
# tagged commit: a network error, the GitHub API answering with an error,
# or a gate step that failed on the runner rather than on the code. A run
# that failed before the release was published goes green on a re-run once
# the cause has passed. When the release was published and a later step
# failed, a re-run of every job finds the release in `verify`, reports it
# and goes green, and a re-run of the failed `publish` job alone finds it
# there, reports it, prints its URL and goes green; neither creates it
# again. A draft left behind stops `publish` on every re-run until the
# maintainer deletes that draft on the repository's Releases page; a re-run
# then creates the release afresh. A failure the tagged commit itself
# causes (it is not on the default branch, the tag and the header name
# different versions, the gate is red, CHANGELOG.md has no section for the
# version) fails the same way on every re-run.
#
# Remedies. A published release is never edited, replaced or deleted by
# this workflow, an agent or a session, and its tag is never moved: a
# broken release is fixed by a new patch version, through a new release
# prep and the tag that names it.
#
# This file records the publish decision for this repository, which keeps no
# decision records (CLAUDE.md, "Agent authority in this repo": the "Release
# preps" paragraph and the paragraphs after it). This workflow is the only
# publisher: it publishes on the push of the tag that names a merged release
# prep, with the workflow's own GITHUB_TOKEN. No repository secret exists or
# is read. An agent or a session never creates, edits, deletes or uploads to
# a GitHub release by hand, and a failed run is re-run from its Actions
# page, never worked round.

on:
  push:
    tags:
      - "v*.*.*"

# The default for every job: contents: read, every other permission none.
# Each job states its own permissions below, and only `publish` raises
# contents to write. The tag already exists when this runs, and nothing here
# creates or pushes one.
permissions:
  contents: read

# One run per tag, and a run in progress is never cancelled: a release cut
# off part way is worse than one that finishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify, gate and make the tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    # contents: read for the checkout, the default branch fetch and the
    # release lookup.
    permissions:
      contents: read

    # The gate runs with clang, as ci.yml's `gate` job runs it.
    env:
      CC: clang

    outputs:
      released: ${{ steps.released.outputs.released }}
      tarball_sha256: ${{ steps.files.outputs.tarball_sha256 }}
      notes_sha256: ${{ steps.files.outputs.notes_sha256 }}

    steps:
      # The tagged commit, by SHA. Full history and the tags: the ancestry
      # check walks the history and `git archive` reads the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The default branch is read from the push event itself, never written
      # here, so a renamed default branch needs no edit to this file. The
      # repository is public, so the fetch needs no credential.
      - name: Fetch the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$DEFAULT_BRANCH" || { echo "::error::the push event names no default branch" >&2; exit 1; }
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

      - name: Check the tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::${GITHUB_REF_NAME} names ${commit}, not the pushed ${GITHUB_SHA}; nothing is released" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${GITHUB_REF_NAME} is on ${commit}, which is not on ${DEFAULT_BRANCH}; nothing is released" >&2
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on ${commit}, which is on ${DEFAULT_BRANCH}"

      # The header is read with sed, before any tool is installed. The CMake
      # project version is checked again after the gate, from the cache its
      # configure wrote.
      - name: Check the tag names UXID_VERSION_STRING
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          header_version="$(sed -n 's/^#define UXID_VERSION_STRING "\([^"]*\)"$/\1/p' include/uxid.h)"
          test -n "$header_version" || { echo "::error::no UXID_VERSION_STRING in include/uxid.h at the tagged commit" >&2; exit 1; }
          if [ "$tag_version" != "$header_version" ]; then
            echo "::error::${GITHUB_REF_NAME} names ${tag_version} but include/uxid.h at the tagged commit says ${header_version}; nothing is released" >&2
            exit 1
          fi
          echo "${GITHUB_REF_NAME} matches UXID_VERSION_STRING ${header_version}"

      # A published release on the tag is reported, and the run stops green
      # without creating anything (the header's "Re-running"). 404 means
      # there is none; any other answer stops the step. A read token does
      # not see draft releases; `publish` looks for those.
      - name: Check for a published release on the tag
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          status="$(curl -sS -o "${RUNNER_TEMP}/release.json" -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$url")" || status=000
          echo "${url} answered ${status}"
          case "$status" in
            404)
              echo "no published release on ${GITHUB_REF_NAME}"
              echo "released=false" >> "$GITHUB_OUTPUT"
              ;;
            200)
              release_url="$(jq -er '.html_url' "${RUNNER_TEMP}/release.json")"
              echo "::notice::${GITHUB_REF_NAME} already has a published release, ${release_url}; reported, nothing is created"
              echo "released=true" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::the releases API answered ${status} for ${GITHUB_REF_NAME}; nothing is released" >&2; exit 1 ;;
          esac

      # --- the tools and the full gate, exactly as ci.yml's gate job runs
      # them.

      # The tools come from mise.toml, provisioned by mise itself. No tool
      # cache is restored: a release installs its tools fresh rather than
      # from a cache another run wrote.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.released.outputs.released == 'false'
        with:
          version: 2026.8.2
          cache: false

      # The command is read out of .claude/wurk.json (gate.full), the gate an
      # agent must have green before committing. It is read and executed
      # inside the step rather than interpolated into `run:`, so a repository
      # file never reaches the shell as expression text.
      - name: Full gate
        if: steps.released.outputs.released == 'false'
        run: |
          set -euo pipefail
          mapfile -t cmd < <(jq -er '.gate.full[]' .claude/wurk.json)
          test "${#cmd[@]}" -gt 0 || { echo "::error::gate.full is empty" >&2; exit 1; }
          echo "gate command (.claude/wurk.json gate.full): ${cmd[*]}"
          "${cmd[@]}"

      # --- end of the gate.

      # The gate's build trees land under build/, which .gitignore covers.
      # A gate that left any changed file, or any untracked file that is not
      # ignored, stops the release here, with the files named.
      - name: Check the gate left the checkout clean
        if: steps.released.outputs.released == 'false'
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::the gate left changed or untracked files; nothing is released" >&2
            exit 1
          fi

      - name: Check the tag names the CMake project version
        if: steps.released.outputs.released == 'false'
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cmake_version="$(sed -n 's/^CMAKE_PROJECT_VERSION:[A-Z]*=//p' build/default/CMakeCache.txt)"
          test -n "$cmake_version" || { echo "::error::the gate's configure recorded no CMAKE_PROJECT_VERSION" >&2; exit 1; }
          if [ "$tag_version" != "$cmake_version" ]; then
            echo "::error::${GITHUB_REF_NAME} names ${tag_version} but the CMake project version is ${cmake_version}; nothing is released" >&2
            exit 1
          fi
          echo "${GITHUB_REF_NAME} matches the CMake project version ${cmake_version}"

      # The tarball is the tag's tree under the directory uxid-VERSION/. The
      # notes are the lines under CHANGELOG.md's `## VERSION` heading (the
      # heading is `## VERSION` alone or followed by a space, such as
      # `## 1.0.0 - 2026-10-21`), up to the next `## ` heading; a missing or
      # empty section stops the step.
      - name: Make the tarball, its SHA-256 and the release notes
        id: files
        if: steps.released.outputs.released == 'false'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="${RUNNER_TEMP}/release"
          rm -rf "$out"
          mkdir -p "$out"
          tarball="uxid-${version}.tar.gz"
          git archive --format=tar.gz --prefix="uxid-${version}/" -o "${out}/${tarball}" "refs/tags/${GITHUB_REF_NAME}"
          (cd "$out" && sha256sum "$tarball" > "${tarball}.sha256")
          cat "${out}/${tarball}.sha256"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($0 == "## " v || index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "${out}/notes.md"
          if ! grep -q '[^[:space:]]' "${out}/notes.md"; then
            echo "::error::CHANGELOG.md has no section, or an empty one, for ${version}; nothing is released" >&2
            exit 1
          fi
          echo "release notes:"
          cat "${out}/notes.md"
          tarball_sha256="$(sha256sum "${out}/${tarball}" | cut -d ' ' -f 1)"
          notes_sha256="$(sha256sum "${out}/notes.md" | cut -d ' ' -f 1)"
          echo "tarball_sha256=${tarball_sha256}" >> "$GITHUB_OUTPUT"
          echo "notes_sha256=${notes_sha256}" >> "$GITHUB_OUTPUT"

      - name: Upload the tarball, its SHA-256 and the notes
        if: steps.released.outputs.released == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    name: Create the GitHub release
    needs: verify
    if: needs.verify.outputs.released == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # contents: write for `gh release create`, and no other permission. This
    # is the only job in this repository's workflows that holds it.
    permissions:
      contents: write

    steps:
      - name: Download the files verify made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/release

      # The .sha256 file checks the tarball, and the tarball and the notes
      # have the SHA-256 values `verify` recorded, or nothing is released.
      - name: Check the files against their SHA-256
        env:
          TARBALL_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
          NOTES_SHA256: ${{ needs.verify.outputs.notes_sha256 }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tarball="uxid-${version}.tar.gz"
          cd "${RUNNER_TEMP}/release"
          for f in "$tarball" "${tarball}.sha256" notes.md; do
            test -f "$f" || { echo "::error::the artifact holds no ${f}; nothing is released" >&2; exit 1; }
          done
          sha256sum --check --strict "${tarball}.sha256" || { echo "::error::${tarball} does not match ${tarball}.sha256; nothing is released" >&2; exit 1; }
          got="$(sha256sum "$tarball" | cut -d ' ' -f 1)"
          if [ -z "$TARBALL_SHA256" ] || [ "$got" != "$TARBALL_SHA256" ]; then
            echo "::error::${tarball} has sha256 ${got}, but verify recorded '${TARBALL_SHA256}'; nothing is released" >&2
            exit 1
          fi
          got="$(sha256sum notes.md | cut -d ' ' -f 1)"
          if [ -z "$NOTES_SHA256" ] || [ "$got" != "$NOTES_SHA256" ]; then
            echo "::error::notes.md has sha256 ${got}, but verify recorded '${NOTES_SHA256}'; nothing is released" >&2
            exit 1
          fi
          echo "${tarball} and notes.md match the SHA-256 values verify recorded"

      # Run again here, where the token also sees drafts: a re-run of this
      # job alone does not re-run `verify`. A published release is reported
      # and the job passes; a draft stops it (the header's "Re-running").
      - name: Check for a release on the tag
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          status="$(curl -sS -o "${RUNNER_TEMP}/release.json" -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$url")" || status=000
          echo "${url} answered ${status}"
          case "$status" in
            404) ;;
            200)
              echo "::notice::${GITHUB_REF_NAME} already has a published release; reported, nothing is created"
              echo "released=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *) echo "::error::the releases API answered ${status} for ${GITHUB_REF_NAME}; nothing is released" >&2; exit 1 ;;
          esac
          drafts="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.draft and .tag_name == env.GITHUB_REF_NAME) | .html_url")"
          if [ -n "$drafts" ]; then
            echo "$drafts"
            echo "::error::a draft release on ${GITHUB_REF_NAME} exists; the maintainer deletes it on the Releases page, then re-runs this job" >&2
            exit 1
          fi
          echo "no release on ${GITHUB_REF_NAME}, published or draft"
          echo "released=false" >> "$GITHUB_OUTPUT"

      # --verify-tag stops the command unless the tag already exists on the
      # repository, so this never creates a tag.
      - name: Create the release
        if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tarball="uxid-${version}.tar.gz"
          cd "${RUNNER_TEMP}/release"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "uxid ${version}" \
            --notes-file notes.md \
            "$tarball" "${tarball}.sha256"

      - name: Print the release's URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url --jq .url
